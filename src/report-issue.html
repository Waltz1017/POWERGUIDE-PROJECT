<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report an Issue | POWERGUIDE</title>
    <link href="./output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .form-input {
            background: rgba(188, 188, 188, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        .form-input:focus {
            border-color: #FFBB02;
            outline: none;
            box-shadow: 0 0 10px rgba(255, 187, 2, 0.3);
        }
    </style>
</head>

<body class="bg-black text-white min-h-screen flex flex-col">

    <!-- Header (Same as Landing) -->
    <header id="mainHeader" class="flex flex-row sticky top-0 z-50 h-16 md:h-25 text-2xl items-center border-b border-gray-400 justify-between px-4 md:px-0 backdrop-blur-[2px] bg-black/50">
        <div class="flex pl-8 items-center gap-2">
            <a href="/src/landing.html#footer" class="flex pl-10 items-center gap-2">
                <img class="w-10 md:w-16" src="../img/logo.png" alt="PowerGuide Logo">
                <div class="flex flex-col justify-center items-start">
                    <span class="text-white font-bold text-lg md:text-xl leading-tight">
                        POWER<span class="text-[#FFBB02]">GUIDE</span>
                    </span>
                    <span class="text-white font-medium text-sm md:text-xs tracking-widest opacity-70 leading-none">
                        SECURITY AND RELIABILITY
                    </span>
                </div>
            </a>
        </div>

        <ul class="hidden md:flex flex-row font-bold gap-6 ml-auto text-gray-400 text-xs md:text-sm mr-10">
            <li ><a href="/src/landing.html#footer">Back to Home</a></li>
        </ul>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-20 px-4">
        <div class="w-full max-w-2xl bg-[#0C0D2A] p-8 md:p-12 rounded-4xl shadow-[0_0_30px_rgba(255,187,2,0.15)] border border-white/5">
            
            <div class="mb-10 text-center">
                <h1 class="text-3xl md:text-4xl font-black mb-2">Report an <span class="text-[#FFBB02]">Issue</span></h1>
                <p class="text-gray-400 text-sm md:text-base">Found a bug or having trouble? Let us know and we'll fix it.</p>
            </div>

            <form action="#" method="POST" class="flex flex-col gap-6">
                <!-- Issue Category -->
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold tracking-widest text-[#FFBB02] uppercase">Type of Issue</label>
                    <select class="form-input rounded-lg bg-[#16184E] border border-gray-600">
                        <option >Technical Bug</option>
                        <option >Account Access</option>
                        <option >Map/Location Error</option>
                        <option >Battery Tracker Issue</option>
                        <option >Other</option>
                    </select>
                
                </div>

                <!-- Email -->
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold tracking-widest text-[#FFBB02] uppercase">Your Email</label>
                    <input type="email" placeholder="how can we reach you?" 
                           class="form-input rounded-lg px-4 py-3 text-sm">
                </div>

                <!-- Description -->
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold tracking-widest text-[#FFBB02] uppercase">Description</label>
                    <textarea rows="5" placeholder="Please provide as much detail as possible..." 
                              class="form-input rounded-lg px-4 py-3 text-sm resize-none"></textarea>
                </div>

                <!-- Attachment (Optional) -->
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold tracking-widest text-[#FFBB02] uppercase">Screenshot (Optional)</label>
                    <input type="file" class="text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-[#FFBB02] file:text-black hover:file:bg-[#D99A00]">
                </div>

                <!-- Submit Button -->
                <button type="button"
    onclick="window.location.href='landing.html'"
    class="mt-4 bg-[#FFBB02] text-black font-bold py-4 rounded-xl hover:bg-[#D99A00] active:scale-95 transition-all shadow-[0_5px_15px_rgba(255,187,2,0.2)]">
    Submit Report
</button>
            </form>
        </div>
    </main>

    <!-- Simple Footer -->
    <footer class="py-10 text-center border-t border-white/10 bg-[#0B0C22]">
        <span class="text-white/50 text-xs tracking-widest uppercase">
            V6 @ 2026 POWERGUIDE. BUILT FOR THE COMMUNITY.
        </span>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
