<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battery Tracker - POWERGUIDE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        #battery-ring {
            transition: stroke-dashoffset 0.5s ease-in-out, stroke 0.3s ease;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .7;
            }
        }

        .status-badge {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>

<body class="text-white bg-gradient-to-br from-[#0F112A] to-[#03041A] min-h-screen selection:bg-yellow-500/30">

    <!-- Header -->
    <header id="mainHeader" class="flex flex-row sticky top-0 z-50 h-16 md:h-25 text-2xl items-center border-b border-gray-400 justify-between px-4 md:px-0 backdrop-blur-[2px] bg-black/50">
        <div class="flex pl-8 items-center gap-2">
            <a href="/src/landing.html#footer" class="flex pl-10 items-center gap-2">
                <img class="w-10 md:w-16" src="../img/logo.png" alt="PowerGuide Logo">
                <div class="flex flex-col justify-center items-start">
                    <span class="text-white font-bold text-lg md:text-xl leading-tight">
                        POWER<span class="text-[#FFBB02]">GUIDE</span>
                    </span>
                    <span class="text-white font-medium text-sm md:text-xs tracking-widest opacity-70 leading-none">
                        SECURITY AND RELIABILITY
                    </span>
                </div>
            </a>
        </div>

        <ul class="hidden md:flex flex-row font-bold gap-6 ml-auto text-gray-400 text-xs md:text-sm mr-10">
            <li ><a href="/src/landing.html#footer">Back to Home</a></li>
        </ul>
    </header>


    <main class="max-w-4xl mx-auto px-6 py-12">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-stretch">

            <!-- Left Side: Main Visual -->
            <section
                class="bg-[#31324C]/40 backdrop-blur-xl border border-white/10 rounded-[2rem] p-10 flex flex-col items-center shadow-2xl">
                <span
                    class="bg-white/10 px-4 py-1 rounded-full text-[10px] font-bold tracking-[0.2em] uppercase text-gray-300 mb-8">
                    Active Session
                </span>

                <!-- Battery Ring -->
                <div class="relative flex items-center justify-center mb-10">
                    <svg class="w-64 h-64 -rotate-90" viewBox="0 0 120 120">
                        <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="8" />
                        <circle id="battery-ring" cx="60" cy="60" r="54" fill="none" stroke="#FFBB02" stroke-width="8"
                            stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="339.29" />
                    </svg>
                    <div class="absolute flex flex-col items-center">
                        <div id="level" class="text-white text-6xl font-bold tracking-tight">--%</div>
                        <span id="state-label"
                            class="text-gray-400 text-xs font-semibold tracking-widest mt-2 uppercase">Standby</span>
                    </div>
                </div>

                <!-- Primary Status Box -->
                <div class="w-full bg-black/20 rounded-2xl p-5 border border-white/5 flex justify-between items-center">
                    <div>
                        <p class="text-[10px] text-gray-500 font-bold tracking-wider uppercase">Power Source</p>
                        <p id="status" class="text-lg font-semibold text-yellow-500">Detecting...</p>
                    </div>
                    <div id="charge-icon" class="text-gray-600">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                    </div>
                </div>
            </section>

            <!-- Right Side: Secondary Stats -->
            <section class="flex flex-col h-full">
                <div
                    class="bg-[#31324C]/40 backdrop-blur-xl border border-white/10 rounded-[2rem] p-8 flex-1 flex flex-col justify-center">
                    <h3 class="text-sm font-bold tracking-widest uppercase text-gray-400 mb-6">Detailed Estimates</h3>

                    <div class="space-y-6">
                        <div class="flex justify-between items-end border-b border-white/5 pb-4">
                            <div>
                                <p class="text-xs text-gray-500 mb-1">Remaining Time</p>
                                <p id="time-remaining" class="text-xl font-semibold">Calculating...</p>
                            </div>
                            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>

                        <div class="flex justify-between items-end border-b border-white/5 pb-4">
                            <div>
                                <p class="text-xs text-gray-500 mb-1">Cycles Completed</p>
                                <p class="text-xl font-semibold">142</p>
                            </div>
                            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                        </div>
                    </div>

                    <!-- Low Battery Alert -->
                    <div id="warning-box"
                        class="hidden mt-8 p-4 bg-red-500/10 border border-red-500/20 rounded-xl flex gap-3 items-center">
                        <div class="text-red-500">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                            </svg>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-red-400 uppercase">Critical Level</p>
                            <p class="text-xs text-red-200/60">Connect power source immediately.</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        const levelEl = document.getElementById("level");
        const statusEl = document.getElementById("status");
        const batteryRing = document.getElementById("battery-ring");
        const timeRemainingEl = document.getElementById("time-remaining");
        const chargeIcon = document.getElementById("charge-icon");
        const warningBox = document.getElementById("warning-box");
        const stateLabel = document.getElementById("state-label");

        const CIRCUMFERENCE = 339.29;

        function updateUI(battery) {
            const level = Math.round(battery.level * 100);
            levelEl.textContent = `${level}%`;

            const offset = CIRCUMFERENCE - (battery.level * CIRCUMFERENCE);
            batteryRing.style.strokeDashoffset = offset;

            if (battery.charging) {
                statusEl.textContent = "Fast Charging";
                statusEl.className = "text-lg font-semibold text-blue-400";
                batteryRing.style.stroke = "#60A5FA";
                chargeIcon.className = "text-blue-400 status-badge";
                stateLabel.textContent = "Replenishing";
                warningBox.classList.add("hidden");

                if (battery.chargingTime !== Infinity) {
                    const mins = Math.round(battery.chargingTime / 60);
                    timeRemainingEl.textContent = mins > 0 ? `${mins} min to full` : "Almost full";
                } else {
                    timeRemainingEl.textContent = "Calculating...";
                }
            } else {
                statusEl.textContent = "Discharging";
                statusEl.className = "text-lg font-semibold text-yellow-500";
                chargeIcon.className = "text-gray-600";
                stateLabel.textContent = "On Battery";

                if (level <= 20) {
                    batteryRing.style.stroke = "#EF4444";
                    statusEl.className = "text-lg font-semibold text-red-500";
                    warningBox.classList.remove("hidden");
                } else if (level <= 50) {
                    batteryRing.style.stroke = "#FBBF24";
                    warningBox.classList.add("hidden");
                } else {
                    batteryRing.style.stroke = "#10B981";
                    warningBox.classList.add("hidden");
                }

                if (battery.dischargingTime !== Infinity) {
                    const hours = Math.floor(battery.dischargingTime / 3600);
                    const mins = Math.round((battery.dischargingTime % 3600) / 60);
                    timeRemainingEl.textContent = `${hours}h ${mins}m left`;
                } else {
                    timeRemainingEl.textContent = "Calculating...";
                }
            }
        }

        if ('getBattery' in navigator) {
            navigator.getBattery().then(battery => {
                updateUI(battery);
                battery.addEventListener('levelchange', () => updateUI(battery));
                battery.addEventListener('chargingchange', () => updateUI(battery));
                battery.addEventListener('chargingtimechange', () => updateUI(battery));
                battery.addEventListener('dischargingtimechange', () => updateUI(battery));
            });
        } else {
            levelEl.textContent = "N/A";
            statusEl.textContent = "Unsupported Browser";
            timeRemainingEl.textContent = "Hardware access denied";
        }
    </script>
</body>

</html>
