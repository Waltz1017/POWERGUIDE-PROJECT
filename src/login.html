<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="./output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
    </style>
</head>

<body class="min-h-screen flex justify-center items-center bg-[#03041A] p-6">

    <!-- Sign-up box -->
    <div class="border shadow-[0_0_20px_#FFBB02]
        rounded-4xl flex flex-col items-center justify-start
        p-10 opacity-80 bg-[#03041A]"
        style="width: 30rem; min-height: 42rem;">

        <!-- Logo -->
        <div class="flex justify-center items-center w-full" style="margin-top:48px;">    
            <img class="w-10 md:w-16" src="../img/logo.png" alt="">

            <div class="flex flex-col justify-center items-start">
                <span class="text-white text-lg md:text-xl font-semibold leading-tight -mb-5">
                    POWER<span class="text-[#FFBB02]">GUIDE</span>
                </span>
                        
                <span class="text-white font-medium text-sm md:text-xs tracking-widest opacity-70 leading-none">
                    SECURITY AND RELIABILITY
                </span>
            </div>
        </div>

        <!-- Email section -->
        <div class="flex flex-col justify-center mt-8">
            <span class="text-white font-semibold">Email</span>
            <input type="email" placeholder="johndoe@gmail.com"
                        class="w-80 h-12 mt-1 mb-8 p-2 font-thin text-white bg-transparent
                        border border-gray-300 rounded-md text-base
                        focus:outline-none focus:border-[#FFBB02]">

            <!-- Password section -->
            <span class="text-white font-semibold mt-8">Password</span>
                <div style="position: relative; width: 20rem; margin-bottom: 0.5rem;">
                    <input type="password" placeholder="********" id="password"
                                class="w-full h-12 p-3 pr-12 mt-1 text-white bg-transparent
                                border border-gray-300 rounded-md text-base
                                focus:outline-none focus:border-[#FFBB02]">
                    <button type="button" onclick="togglePassword()" class="cursor-pointer" onmouseover="this.style.color='#FFBB02'"
                                                                                            onmouseout="this.style.color='#9ca3af'"
                        style="position: absolute; right: 0.75rem; top: 58%; transform: translateY(-50%); color: #9ca3af;">
                        <i id="eyeIcon" class="fas fa-eye text-lg"></i>
                    </button>
                </div>

                <div style="display: flex; justify-content: flex-end; width: 20rem; margin-bottom: 2rem;">
                    <a href=""
                            style="color: #FFBB02; font-weight: bold; font-size: 0.75rem; text-decoration: none;"
                            onmouseover="this.style.color='#D99A00'"
                            onmouseout="this.style.color='#FFBB02'"
                            onmousedown="this.style.color='#FFC833'"
                            onmouseup="this.style.color='#D99A00'">
                            Forgot Password?
                        </a>
                </div>

                <!-- Login button -->
                <div class="flex items-center justify-center">
                    <a href="dashboard.html" onclick="fadeOut(event)">
                        <button class="int-btn font-bold py-2 bg-[#FFBB02]
                            text-black rounded-full hover:bg-[#D99A00] active:bg-[#FFC833]
                            cursor-pointer" style="width: 13rem;">
                            Login
                        </button>
                    </a>
                    
                </div>
                    
                <div class="flex flex-row items-center gap-3 my-4" style="margin-top:15px; margin-bottom:15px;">
                    <hr class="flex-1 w-40  border-[#AFAFAF]" />
                    <span class="text-lg text-[#B5B5B5] font-bold">or</span>
                    <hr class="flex-1  border-[#AFAFAF]" />
                </div>

                <!-- Log in with Google -->
                <div class="flex justify-center">
                    <a href="" 
                        class="int-btn flex items-center justify-center gap-2
                        py-2.5 mb-5 bg-[#03041A]
                        border border-[#FFBB02] rounded-full
                        text-sm font-black font-semibold text-white
                        hover:bg-[#FFBB02] active:bg-[#FFC833] hover:text-black transition"
                        style="width: 13rem;">

                        <svg width="18" height="18" viewBox="0 0 48 48">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9
                            2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72
                            17.74 9.5 24 9.5z" />
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94
                            c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36
                            7.09-17.65z" />
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14
                            .76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56
                            10.78l7.97-6.19z" />
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18
                            1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98
                            6.19C6.51 42.62 14.62 48 24 48z" />
                        </svg>

                        Log in with Google
                    </a>
                </div>

                <div class="flex justify-center">
                    <span class="text-white text-sm mb-10 pb-6 pt-2">
                        Don't have an account?
                        <a href="signup.html" onclick="fadeOut(event)"
                            style="color: #FFBB02; font-weight: bold; font-size: 0.9rem; text-decoration: none;"
                            onmouseover="this.style.color='#D99A00'"
                            onmouseout="this.style.color='#FFBB02'"
                            onmousedown="this.style.color='#FFC833'"
                            onmouseup="this.style.color='#D99A00'">
                            Sign Up
                        </a>
                    </span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        window.addEventListener("load", () => {
            document.body.classList.add("loaded");
        });
    </script>
</body>

</html>
