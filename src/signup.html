<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PowerGuide</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { font-family: 'Montserrat', sans-serif; }
  </style>
</head>

<body class="min-h-screen flex justify-center items-center bg-[#03041A] p-6 text-white">

<!-- Signup Box -->
    <div class="shadow-[0_0_20px_#FFBB02]
        rounded-[2rem] flex flex-col items-center justify-start
        p-10 opacity-100 bg-[#03041A]"
        style="width: 52rem; min-height: 39rem;">

        <!-- Logo -->
        <div class="flex justify-center items-center w-full mt-2">    
            <img class="w-10 md:w-16" src="../img/logo.png" alt="">

            <div class="flex flex-col justify-center items-start leading-none">
                <span class="text-white text-lg md:text-xl font-semibold leading-none">
                    POWER<span class="text-[#FFBB02]">GUIDE</span>
                </span>

                <span class="text-white font-normal text-sm md:text-xs tracking-widest opacity-70 leading-none -mt-1">
                    SECURITY AND RELIABILITY
                </span>
            </div>
        </div>

    <!-- Form -->
    <div class="flex flex-col">

      <!-- Email -->
      <div class="mb-3">
        <label class="block text-xs text-gray-400 mb-1">Email</label>
        <input type="email"
          class="w-full h-9 rounded-md border border-gray-300 bg-[#020c14]/90 text-white text-sm font-thin px-3 outline-none focus:border-amber-400">
      </div>

      <!-- Name -->
      <div class="mb-3">
        <label class="block text-xs text-gray-400 mb-1">Full Name</label>
        <input type="text"
          class="w-full h-9 rounded-md border border-gray-300 bg-[#020c14]/90 text-white text-sm font-thin px-3 outline-none focus:border-amber-400">
      </div>

      <!-- Contact -->
      <div class="mb-3">
        <label class="block text-xs text-gray-400 mb-1">Contact Number</label>
        <input type="tel" id="contact"
          maxlength="11"
          inputmode="numeric"
          oninput="this.value = this.value.replace(/[^0-9]/g, '')"
          class="w-full h-9 rounded-md border border-gray-300 bg-[#020c14]/90 text-white text-sm font-thin px-3 outline-none focus:border-amber-400">
      </div>

      <!-- Password -->
      <div class="mb-4 relative">
        <label class="block text-xs text-gray-400 mb-1">Password</label>

        <input type="password" id="password"
          class="w-full h-9 rounded-md border border-gray-300 bg-[#020c14]/90 text-white text-sm font-thin px-3 pr-10 outline-none focus:border-amber-400">

        <i id="eyeIcon" onclick="togglePassword()"
          class="fa-solid fa-eye absolute right-3 top-[30px] text-gray-400 cursor-pointer hover:text-amber-400"></i>
      </div>

      <!-- Button -->
      <button onclick="validateForm()"
        class="w-full h-9 rounded-md bg-gradient-to-r from-amber-400 to-amber-500 text-black text-sm font-semibold hover:scale-[1.02] active:scale-[0.98] transition">
        Create Account
      </button>

      <!-- Divider -->
      <div class="text-center my-3 text-gray-400 text-xs">or</div>

      <!-- Google -->
      <button class="w-full h-9 rounded-md border border-amber-400/40 flex items-center justify-center gap-2 text-sm hover:bg-amber-400/10 transition">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" class="w-4 h-4">
        Sign up with Google
      </button>

      <!-- Login -->
      <p class="text-center text-xs text-gray-400 mt-3">
        Already have an account?
        <a href="#" class="text-amber-400 hover:underline">Log in</a>
      </p>

    </div>

  </div>
</div>

<script>
function togglePassword() {
  const pass = document.getElementById("password");
  const icon = document.getElementById("eyeIcon");

  if (pass.type === "password") {
    pass.type = "text";
    icon.classList.replace("fa-eye", "fa-eye-slash");
  } else {
    pass.type = "password";
    icon.classList.replace("fa-eye-slash", "fa-eye");
  }
}

function validateForm() {
  const contact = document.getElementById("contact").value;

  if (contact.length !== 11) {
    alert("Contact number must be exactly 11 digits.");
    return;
  }

  alert("Form valid! Ready to submit.");
}
</script>

</body>
</html>
